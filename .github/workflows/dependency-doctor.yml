name: dependency-doctor

on:
  push:
    paths:
      - "requirements*.txt"
      - "constraints*.txt"
      - "pyproject.toml"
      - ".github/workflows/dependency-doctor.yml"
  pull_request:
    paths:
      - "requirements*.txt"
      - "constraints*.txt"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  dependency-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 dependency-doctor
        run: pip install git+https://github.com/DaBaoAgent/dependency-doctor.git@v0.1.0
      - name: 依赖体检（未固定版本/标准库遮蔽/过时backport/重复约束/yanked）
        run: dependency-doctor . --fail-on error
